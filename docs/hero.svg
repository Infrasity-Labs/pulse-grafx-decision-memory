<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="pulse-grafx-decision-memory-demo. Decisions go in once. They survive a crash.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="1" stop-color="#0d0c18"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="clip"><rect width="1280" height="360"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <ellipse cx="1090" cy="40" rx="300" ry="170" fill="#5b3fd1" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="1220" cy="260" rx="220" ry="130" fill="#3b2a8f" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="170" cy="400" rx="260" ry="120" fill="#7a5cf0" opacity="0.5" filter="url(#soft)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="96" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#f5f3ff">pulse-grafx-decision-memory-demo</text>
  <text x="96" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#c4bde6">decisions go in once. they survive a crash.</text>
  <text x="96" y="296" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#8c86b0">OKTO PULSE + OKTO GRAFX</text>
</svg>
