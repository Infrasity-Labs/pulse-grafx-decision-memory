<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Decision memory with Okto Pulse and Okto Grafx. Decisions go in once. They survive a crash, and you can read them straight from the file.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b2fc4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5b2fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.04" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#12536a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#12536a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#60c7f1"/>
      <stop offset="0.5" stop-color="#8a8ff8"/>
      <stop offset="1" stop-color="#b181ef"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a2e"/>
      <stop offset="1" stop-color="#0f1222"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#8983ac" fill-opacity="0.14"/></pattern>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <marker id="arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="#9d83ff"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="#7b91f6"/></marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="#ff6b8b"/></marker>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>
  <rect width="1280" height="420" fill="url(#violet)"/>
  <rect width="1280" height="420" fill="url(#teal)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" fill="none" stroke="#aeb7df" stroke-opacity="0.14"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#headline)"/>

  <!-- decision graph: labelled decision cards -->
  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
    <!-- edges -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M1000 100 L882 100" stroke="#9d83ff" stroke-width="3" marker-end="url(#arV)"/>
      <path d="M1120 130 L1120 186" stroke="#ff6b8b" stroke-dasharray="7 5" marker-end="url(#arC)"/>
      <path d="M1000 218 L882 218" stroke="#7b91f6" marker-end="url(#arB)"/>
      <path d="M1120 248 L1120 298" stroke="#3f4566"/>
      <path d="M780 248 L780 298" stroke="#3f4566"/>
    </g>
    <g font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#979bad">
      <text x="941" y="90" text-anchor="middle" fill="#b9a6ff">supersedes</text>
      <text x="1132" y="162">contradicts</text>
      <text x="941" y="208" text-anchor="middle" fill="#9fb0ff">depends_on</text>
    </g>

    <!-- active decision glow -->
    <rect x="1000" y="70" width="240" height="60" rx="12" fill="#7a4cff" opacity="0.55" filter="url(#glow)"/>

    <!-- cards -->
    <g>
      <rect x="680" y="70" width="202" height="60" rx="12" fill="url(#card)" stroke="#3f4566"/>
      <text x="698" y="94" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#6d7186">D-04 · superseded</text>
      <text x="698" y="116" font-size="14.5" fill="#7d8198" text-decoration="line-through">Store JWT in a cookie</text>

      <rect x="1000" y="70" width="240" height="60" rx="12" fill="url(#card)" stroke="#9d83ff" stroke-width="1.6"/>
      <text x="1018" y="94" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b9a6ff">D-11 · active</text>
      <text x="1018" y="116" font-size="15.5" font-weight="500" fill="#eef0fb">Opaque server-side sessions</text>

      <rect x="680" y="188" width="202" height="60" rx="12" fill="url(#card)" stroke="#2f7f95"/>
      <text x="698" y="212" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#41d7ee">D-07 · active</text>
      <text x="698" y="234" font-size="15" fill="#d0d3e3">Rate limit: 100 / minute</text>

      <rect x="1000" y="188" width="240" height="60" rx="12" fill="url(#card)" stroke="#ff6b8b" stroke-opacity="0.75"/>
      <text x="1018" y="212" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ff8fa8">D-12 · conflicts with D-11</text>
      <text x="1018" y="234" font-size="15" fill="#d0d3e3">Stateless tokens for the API</text>

      <rect x="1000" y="298" width="240" height="52" rx="12" fill="url(#card)" stroke="#2f7f95"/>
      <text x="1018" y="320" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#41d7ee">D-15 · active</text>
      <text x="1018" y="340" font-size="15" fill="#d0d3e3">Stay on REST, no GraphQL</text>

      <rect x="680" y="298" width="202" height="52" rx="12" fill="url(#card)" stroke="#2f7f95"/>
      <text x="698" y="320" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#41d7ee">D-09 · active</text>
      <text x="698" y="340" font-size="15" fill="#d0d3e3">No Redis in the first cut</text>
    </g>
  </g>

  <!-- text -->
  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="2.4" fill="#41d7ee">OKTO PULSE  +  OKTO GRAFX</text>
    <text x="64" y="172" font-size="72" font-weight="600" fill="url(#headline)" letter-spacing="-1">Decision memory</text>
    <text x="64" y="226" font-size="26" font-weight="500" fill="#e6e8f4">Decisions go in once.</text>
    <text x="64" y="262" font-size="21" fill="#a9acbe">They survive a crash, and you can read</text>
    <text x="64" y="290" font-size="21" fill="#a9acbe">them straight from the file.</text>
  </g>

  <!-- chips -->
  <g font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">
    <rect x="64" y="322" width="84" height="32" rx="16" fill="#0b0d14" stroke="#41d7ee" stroke-opacity="0.7"/><text x="106" y="343" text-anchor="middle">Record</text>
    <rect x="158" y="322" width="78" height="32" rx="16" fill="#0b0d14" stroke="#41d7ee" stroke-opacity="0.7"/><text x="197" y="343" text-anchor="middle">Recall</text>
    <rect x="246" y="322" width="86" height="32" rx="16" fill="#0b0d14" stroke="#9d83ff" stroke-opacity="0.8"/><text x="289" y="343" text-anchor="middle">Reverse</text>
    <rect x="342" y="322" width="82" height="32" rx="16" fill="#0b0d14" stroke="#ff6b8b" stroke-opacity="0.8"/><text x="383" y="343" text-anchor="middle">SIGKILL</text>
    <rect x="434" y="322" width="120" height="32" rx="16" fill="#0b0d14" stroke="#41d7ee" stroke-opacity="0.7"/><text x="494" y="343" text-anchor="middle">Read the file</text>
    <rect x="564" y="322" width="82" height="32" rx="16" fill="#0b0d14" stroke="#9d83ff" stroke-opacity="0.8"/><text x="605" y="343" text-anchor="middle">Restore</text>
  </g>
  <text x="64" y="392" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#6d7186">okto-pulse 0.4.2 · okto-grafx 0.0.8 · verified 2026-10-29 · one real run on one machine</text>
</svg>
