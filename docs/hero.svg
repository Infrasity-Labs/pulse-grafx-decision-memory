<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Decision memory with Okto Pulse and Okto Grafx. Decisions go in once. They survive a crash, and you can read them straight from the file.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.8" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#422187" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#422187" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.05" cy="0.78" r="0.4">
      <stop offset="0" stop-color="#12536a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#12536a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0" stop-color="#60c7f1"/>
      <stop offset="0.45" stop-color="#7b91f6"/>
      <stop offset="1" stop-color="#b181ef"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#8983ac" fill-opacity="0.16"/></pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#violet)"/>
  <rect width="1280" height="400" fill="url(#teal)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#aeb7df" stroke-opacity="0.13"/>

  <!-- graph motif. Node outlines use the Grafx cyan and violet. Edge colours: supersedes violet, contradicts coral, depends_on blue -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M900 120 L1010 70" stroke="#7b91f6"/>
    <path d="M1010 70 L1150 130" stroke="#7b91f6"/>
    <path d="M900 120 L990 230" stroke="#9d83ff" stroke-width="3"/>
    <path d="M1150 130 L1100 270" stroke="#3a3f5a"/>
    <path d="M990 230 L1100 270" stroke="#3a3f5a"/>
    <path d="M900 120 L830 250" stroke="#3a3f5a"/>
    <path d="M830 250 L990 230" stroke="#7b91f6"/>
    <path d="M1100 270 L1190 330" stroke="#3a3f5a"/>
    <path d="M990 230 L1010 330" stroke="#3a3f5a"/>
    <path d="M900 120 L990 230" stroke="#ff6b8b" stroke-dasharray="8 6" transform="translate(7 -4)"/>
  </g>
  <g stroke-width="3" fill="#0b0d14">
    <g stroke="#41d7ee">
      <circle cx="900" cy="120" r="22"/><circle cx="1010" cy="70" r="22"/><circle cx="1150" cy="130" r="22"/>
      <circle cx="830" cy="250" r="22"/><circle cx="1100" cy="270" r="22"/><circle cx="1190" cy="330" r="15"/><circle cx="1010" cy="330" r="15"/>
    </g>
    <circle cx="990" cy="230" r="22" stroke="#9d83ff"/>
  </g>
  <circle cx="990" cy="230" r="35" fill="none" stroke="#9d83ff" stroke-opacity="0.32" stroke-width="2"/>

  <!-- legend -->
  <g font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#979bad">
    <line x1="826" y1="372" x2="852" y2="372" stroke="#9d83ff" stroke-width="3"/><text x="860" y="376">supersedes</text>
    <line x1="958" y1="372" x2="984" y2="372" stroke="#ff6b8b" stroke-width="3" stroke-dasharray="6 4"/><text x="992" y="376">contradicts</text>
    <line x1="1096" y1="372" x2="1122" y2="372" stroke="#7b91f6" stroke-width="3"/><text x="1130" y="376">depends_on</text>
  </g>

  <!-- text -->
  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="2.4" fill="#41d7ee">OKTO PULSE  +  OKTO GRAFX</text>
    <text x="64" y="158" font-size="58" font-weight="500" fill="url(#headline)">Decision memory</text>
    <text x="64" y="212" font-size="24" fill="#d0d3e3">Decisions go in once.</text>
    <text x="64" y="244" font-size="24" fill="#a9acbe">They survive a crash, and you can read</text>
    <text x="64" y="276" font-size="24" fill="#a9acbe">them straight from the file.</text>
  </g>

  <!-- chips -->
  <g font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">
    <rect x="64" y="312" width="84" height="32" rx="16" fill="#0b0d14" stroke="#41d7ee" stroke-opacity="0.7"/><text x="106" y="333" text-anchor="middle">Record</text>
    <rect x="158" y="312" width="78" height="32" rx="16" fill="#0b0d14" stroke="#41d7ee" stroke-opacity="0.7"/><text x="197" y="333" text-anchor="middle">Recall</text>
    <rect x="246" y="312" width="86" height="32" rx="16" fill="#0b0d14" stroke="#9d83ff" stroke-opacity="0.8"/><text x="289" y="333" text-anchor="middle">Reverse</text>
    <rect x="342" y="312" width="82" height="32" rx="16" fill="#0b0d14" stroke="#ff6b8b" stroke-opacity="0.8"/><text x="383" y="333" text-anchor="middle">SIGKILL</text>
    <rect x="434" y="312" width="120" height="32" rx="16" fill="#0b0d14" stroke="#41d7ee" stroke-opacity="0.7"/><text x="494" y="333" text-anchor="middle">Read the file</text>
    <rect x="564" y="312" width="82" height="32" rx="16" fill="#0b0d14" stroke="#9d83ff" stroke-opacity="0.8"/><text x="605" y="333" text-anchor="middle">Restore</text>
  </g>
  <text x="64" y="378" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#6d7186">okto-pulse 0.4.2 and okto-grafx 0.0.8, verified 2026-10-29, one real run on one machine</text>
</svg>
