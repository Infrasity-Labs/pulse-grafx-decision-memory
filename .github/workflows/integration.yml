name: integration

# Runs the real products, not recorded files: installs the pinned okto-pulse and okto-grafx, starts Pulse on a temporary data home and
# free ports, runs the non-LLM steps (1, 2, 3b, 5, 6, 7, 8, 9 with the scripted client and the scripted agents) and asserts what came back.
# No LLM and no secret. Takes about 20 to 25 minutes, mostly the Kill B wait for the writer lease. Never touches a default Pulse data home or ports.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "agents/**"
      - "config/**"
      - "corpus/**"
      - "run_demo.py"
      - "requirements*.txt"
      - "constraints*.txt"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      # a version bump of Pulse or Grafx changes these two files
      - "requirements*.txt"
      - "constraints*.txt"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUIRE_EVIDENCE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-minilm-l6-v2
      - name: Install the pinned packages
        # The scripts expect .venv in the repo root. The CPU wheel of torch keeps the download small. The pin in constraints.txt still decides the version.
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip list --format=freeze | grep -iE '^(okto|fastmcp|mcp|sentence-transformers|torch|transformers|numpy)=='
      - name: Run steps 1 to 9 without an LLM and assert the outcomes
        run: .venv/bin/python scripts/run_integration.py --work .work/integration --require-step9
      - name: Upload logs and the new demo-state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure
          if-no-files-found: warn
          path: |
            .work/integration/logs/*.log
            .work/integration/state
            .work/logs/*.log
