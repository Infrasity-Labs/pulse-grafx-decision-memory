name: external links

# Network link checks are kept out of the push and pull request path: a dead URL elsewhere on the internet must not block a code change.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check external links (fails on 404 and 410 only)
        run: python scripts/check_links.py --external
